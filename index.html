function go(t){ tab = t; confirmReset = false; fixEdit = null; svEdit = null; svDep = null; zsEdit = null; zsPay = null; zsUndoArm = null; incEdit = false; incDelArm = null; glEdit = null; glPayArm = null; glDelArm = false; phEdit = null; phDelArm = false; try{ history.replaceState(null,'', t==='home' ? location.pathname : '#'+t); }catch(e){} render(); window.scrollTo(0,0); }

/* ---------- események ---------- */
document.addEventListener('click', e => {
  if(e.target.closest('.scrim')) return e.target.closest('#scan') ? closeScan() : e.target.closest('#edit') ? closeEdit() : closeAdd();
  if(e.target.closest('[data-edit-close]')) return closeEdit();
  const b = e.target.closest('button');
  if(!b){
    if(e.target.closest('[data-recent]')){ recentOpen = !recentOpen; showAll = false; return render(); }
    const t = e.target.closest('[data-toggle]'); if(t) toggleEntry(t.dataset.toggle); return;
  }
  if(pendingDelete && !b.dataset.del){ pendingDelete = null; }
  if(svDepDel && !b.dataset.sdDel){ svDepDel = null; }
  if(zsUndoArm && !(b.dataset.zsUndo || '').startsWith(zsUndoArm + '|')){ zsUndoArm = null; }
  if(incDelArm && b.dataset.incDel !== incDelArm){ incDelArm = null; }
  if(glPayArm && b.dataset.glPay !== glPayArm){ glPayArm = null; }
  if(glDelArm && !('glDel' in b.dataset)) glDelArm = false;
  if(phDelArm && !('phDel' in b.dataset)) phDelArm = false;
  if(b.dataset.glEdit){ glEdit = b.dataset.glEdit; glDelArm = false; return render(); }
  if(b.dataset.glAdd){ glEdit = 'new:' + b.dataset.glAdd; return render(); }
  if('glDel' in b.dataset){ if(!glDelArm){ glDelArm = true; return render(); }
    const ph = S.phases.find(x => x.items.some(i => i.id === glEdit)); if(ph){ forgetPaid(ph.items.filter(i => i.id === glEdit)); ph.items = ph.items.filter(i => i.id !== glEdit); }
    glEdit = null; glDelArm = false; save(); render(); return toast('Tétel törölve', false); }
  if(b.dataset.phEdit){ phEdit = b.dataset.phEdit; phDelArm = false; return render(); }
  if('phAdd' in b.dataset){ const ph = { id:uid(), name:`${S.phases.length + 1}. fázis`, items:[], unlockBy:[] }; S.phases.push(ph); save(); phEdit = ph.id; return render(); }
  if('phSave' in b.dataset) return savePhase();
  if('phDel' in b.dataset){ if(!phDelArm){ phDelArm = true; return render(); }
    const ph = phaseById(phEdit); if(ph){ forgetPaid(ph.items); S.phases = S.phases.filter(x => x.id !== ph.id); S.phases.forEach(x => { x.unlockBy = (x.unlockBy || []).filter(id => id !== ph.id); }); }
    phEdit = null; phDelArm = false; save(); render(); return toast('Fázis törölve', false); }
  if('glCancel' in b.dataset){ glEdit = null; return render(); }
  if('glSave' in b.dataset) return saveGoal();
  if('glUnpay' in b.dataset){ const it = goalItems().find(i => i.id === glEdit); if(it){ it.paid = null; } glEdit = null; save(); render(); return toast('Visszaállítva, az ár visszakerült a Megtakarításba', false); }
  if(b.dataset.glPay){ const it = goalItems().find(i => i.id === b.dataset.glPay); if(!it) return;
    /* egy koppintás: pipa be / ki; a levont összeg alapból a tervezett ár */
    if(it.paid){ it.paid = null; save(); render(); return toast(`${it.name}: pipa levéve, ${ft(it.price)} visszakerült`, false); }
    it.paid = { date:ymd(new Date()), price:it.price }; save(); render(); return toast(`${it.name}: ${ft(it.price)} levonva a Megtakarításból`, false); }
  if(b.dataset.zsEdit){ zsEdit = b.dataset.zsEdit; zsDelArm = false; return render(); }
  if('zsCancel' in b.dataset){ zsEdit = null; zsPay = null; zsDelArm = false; return render(); }
  if('zsSave' in b.dataset) return saveZseb();
  if('zsDel' in b.dataset){ if(!zsDelArm){ zsDelArm = true; return render(); }
    const z = S.pockets.find(x => x.id === zsEdit), bal = z ? zsBalance(z) : 0;
    S.pockets = S.pockets.filter(x => x.id !== zsEdit); zsEdit = null; zsDelArm = false; save(); render();
    return toast('Zseb törölve', false); }
  if(b.dataset.zsPay){ zsPay = b.dataset.zsPay; return render(); }
  if('zpSave' in b.dataset) return payZseb();
  if(b.dataset.zsUndo){ const [zid, i] = b.dataset.zsUndo.split('|'); if(zsUndoArm !== zid){ zsUndoArm = zid; return render(); } return undoZseb(zid, +i); }
  if('incNew' in b.dataset){ incEdit = true; return render(); }
  if('incCancel' in b.dataset){ incEdit = false; return render(); }
  if('incSave' in b.dataset) return saveIncome();
  if(b.dataset.incDel){ if(incDelArm !== b.dataset.incDel){ incDelArm = b.dataset.incDel; return render(); }
    S.income = S.income.filter(x => x.id !== b.dataset.incDel); incDelArm = null; save(); render(); return toast('Bevétel törölve', false); }
  if('reload' in b.dataset){ try{ localStorage.removeItem(LS_KEY); }catch(_){} return location.reload(); }
  if('keepLocal' in b.dataset){ cloud.ref.get().then(s => { cloud.base = s.exists ? (s.data().updatedAt || 0) : 0; cloud.conflict = false; const el = document.getElementById('conflict'); if(el) el.remove(); save(); toast('Ennek az eszköznek az adatai mentve a felhőbe', false); }); return; }
  if('signIn' in b.dataset) return signIn();
  if('signOut' in b.dataset) return signOut();
  if(b.dataset.tab) return go(b.dataset.tab);
  if(b.dataset.go) return go(tab === b.dataset.go ? 'home' : b.dataset.go);
  if(b.dataset.themeSet){ S.settings.theme = b.dataset.themeSet; save(); return render(); }
  if('useCalc' in b.dataset){ e.preventDefault(); S.settings.rate = Math.round(S.settings.salary / (S.settings.hours||1)); save(); return render(); }
  if('add' in b.dataset) return openAdd();
  if(b.dataset.fxEdit){ fixEdit = b.dataset.fxEdit; fixDelArm = false; return render(); }
  if('fxNew' in b.dataset){ fixEdit = 'new'; fixDelArm = false; render(); const n = document.getElementById('fx-name'); if(n) n.focus(); return; }
  if('fxCancel' in b.dataset){ fixEdit = null; fixDelArm = false; return render(); }
  if('fxSave' in b.dataset) return saveFix();
  if('fxDel' in b.dataset){ if(!fixDelArm){ fixDelArm = true; return render(); } S.fixed = S.fixed.filter(x => x.id !== fixEdit); fixEdit = null; fixDelArm = false; save(); render(); return toast('Fix költség törölve', false); }
  if(b.dataset.fxPaid){ const f = S.fixed.find(x => x.id === b.dataset.fxPaid); const p = periodOf(); if(fixedPaid(f) && !paidMap(p)[f.id]) return toast('Ez a kifizetés egy rögzített tételből jön', false); return togglePaid(f.id, f.amount); }
  if(b.dataset.svOpen){ svOpen = svOpen === b.dataset.svOpen ? null : b.dataset.svOpen; svEdit = null; svDep = null; svDelArm = false; return render(); }
  if(b.dataset.svEdit){ svEdit = b.dataset.svEdit; svDelArm = false; render(); const n = document.getElementById('sv-name'); if(n && svEdit === 'new') n.focus(); return; }
  if('svCancel' in b.dataset){ svEdit = null; svDep = null; svDelArm = false; return render(); }
  if('svSave' in b.dataset) return saveSaving();
  if('svDel' in b.dataset){ if(!svDelArm){ svDelArm = true; return render(); } S.savings = S.savings.filter(x => x.id !== svEdit); svEdit = null; svOpen = null; svDelArm = false; save(); render(); return toast('Megtakarítási forma törölve', false); }
  if(b.dataset.svDep){ svDep = b.dataset.svDep; svOpen = svDep; render(); const n = document.getElementById('sd-amount'); if(n) n.focus(); return; }
  if('sdSave' in b.dataset) return saveDeposit();
  if(b.dataset.sdDel){ const [sid, did] = b.dataset.sdDel.split('|'); const v = S.savings.find(x => x.id === sid); if(!v) return;
    if(svDepDel !== did){ svDepDel = did; return render(); }
    const d = v.deposits.find(x => x.id === did); if(d && d.auto) (v.skip ||= []).push(d.auto);
    v.deposits = v.deposits.filter(x => x.id !== did); svDepDel = null; save(); render(); return toast('Befizetés törölve', false); }
  if('photo' in b.dataset){ const inp = document.getElementById('photo-input'); inp.value = ''; return inp.click(); }
  if('scanClose' in b.dataset) return closeScan();
  if('scanManual' in b.dataset){ closeScan(); return openAdd(); }
  if(b.dataset.scCat){ scan.data.cat = b.dataset.scCat; return renderScan(); }
  if(b.dataset.scDel){ scan.data.items.splice(+b.dataset.scDel, 1); return renderScan(); }
  if('scAdd' in b.dataset){ scan.data.items.push({ name:'', amount:0 }); renderScan(); const n = document.querySelectorAll('.sc-name'); if(n.length) n[n.length-1].focus(); return; }
  if('scSave' in b.dataset) return saveScan();
  if('close' in b.dataset) return closeAdd();
  if(b.dataset.cat) return addExpense(b.dataset.cat);
  if('more' in b.dataset){ showAll = true; return render(); }
  if(b.dataset.split){ splitMode = b.dataset.split; return render(); }
  if('splitCancel' in b.dataset){ splitMode = null; return render(); }
  if(b.dataset.splitAt){ return splitEntry(b.dataset.entry, +b.dataset.splitAt); }
  if(b.dataset.merge){ return mergeEntry(b.dataset.merge); }
  if(b.dataset.del){
    if(pendingDelete === b.dataset.del){ S.expenses = S.expenses.filter(x => x.id !== b.dataset.del); pendingDelete = null; save(); render(); return toast('Tétel törölve', false); }
    pendingDelete = b.dataset.del; return render();
  }
  if('undo' in b.dataset){ if(lastAdded){ S.expenses = S.expenses.filter(x => x.id !== lastAdded); lastAdded = null; save(); render(); } document.getElementById('toast').hidden = true; return; }
  if('setupSave' in b.dataset) return saveSetup();
  if('export' in b.dataset) return exportData();
  if(b.dataset.relDel !== undefined){ const i = +b.dataset.relDel;
    if(relDelArm !== i){ relDelArm = i; return render(); }
    const r = S.released[i]; S.released.splice(i, 1); relDelArm = null; save(); render(); return toast(`${ft(r.amount)} kivéve a pluszból`, false); }
  if('import' in b.dataset){ const inp = document.getElementById('import-input'); inp.value = ''; return inp.click(); }
  if('reset' in b.dataset){ confirmReset = true; return render(); }
  if('resetNo' in b.dataset){ confirmReset = false; return render(); }
  if('resetYes' in b.dataset){ const theme = S.settings.theme; S = hydrate(null); S.settings.theme = theme; confirmReset = false; save(); needSetup = true; return render(); }
});
const FIELD = { 's-salary':['settings','salary'], 's-hours':['settings','hours'], 's-rate':['settings','rate'], 's-payday':['settings','payday'],
  's-goal':['settings','goalSaving'], 's-budget':['settings','budget'], 's-fund':['goalFund','start'], 's-accain':['settings','accAIn'] };
document.addEventListener('change', e => { if(e.target.id === 's-accA' || e.target.id === 's-accB'){ S.settings[e.target.id.slice(2)] = e.target.value.trim(); save(); render(); } });
document.addEventListener('change', e => {
  const f = FIELD[e.target.id]; if(!f) return;
  let v = Math.round(Number(e.target.value));
  if(!isFinite(v) || v < 0) v = 0;
  if(f[1] === 'payday') v = Math.min(28, Math.max(1, v || 1));
  if(f[1] === 'hours' || f[1] === 'rate') v = Math.max(1, v);
  S[f[0]][f[1]] = v; save(); render();
});
function exportData(){
  const blob = new Blob([JSON.stringify(S, null, 1)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `eletido-kassza-mentes-${ymd(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Mentés letöltve', false);
}
async function importData(file){
  try{
    const o = JSON.parse(await file.text());
    if(!o || typeof o !== 'object' || !o.settings) throw new Error('nem mentésfájl');
    S = hydrate(o); S.updatedAt = Date.now(); writeLocal(); needSetup = false; tab = 'home'; render();
    toast('Adatok betöltve', false);
  }catch(err){ toast('Ez nem az app mentésfájlja', false); }
}
document.addEventListener('change', e => { if(e.target.id === 'import-input' && e.target.files && e.target.files[0]) importData(e.target.files[0]); });
document.addEventListener('change', e => { if(e.target.id === 'photo-input' && e.target.files && e.target.files[0]) startScan(e.target.files[0]); });
document.addEventListener('input', e => {
  if(scan.data && e.target.closest && e.target.closest('#scan')){
    const t = e.target, d = scan.data;
    if(t.id === 'sc-shop') d.shop = t.value;
    else if(t.id === 'sc-date') d.date = t.value || d.date;
    else if(t.id === 'sc-time') d.time = t.value;
    else if(t.classList.contains('sc-name')) d.items[+t.dataset.i].name = t.value;
    else if(t.classList.contains('sc-amt')){ const neg = /^\s*[-−]/.test(t.value); const v = Math.round(Number(t.value.replace(/[^\d]/g, ''))) || 0; d.items[+t.dataset.i].amount = neg ? -v : v; }
    document.getElementById('sc-sumbox').innerHTML = scanSumLine();
    const s = sum(d.items, x => x.amount), btn = document.querySelector('[data-sc-save]');
    if(btn){ btn.disabled = s <= 0; btn.textContent = `Mentés · ${hrs(Math.max(0, s))}`; }
    return;
  } if(e.target.id === 'a-amount'){ const v = addAmount(); e.target.value = v ? grp(v) : ''; updateAddHours(); } });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !document.getElementById('scan').hidden){ closeScan(); return; } const t = e.target.closest && e.target.closest('[data-toggle]'); if(t && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); toggleEntry(t.dataset.toggle); return; } if(e.key === 'Escape' && !document.getElementById('add').hidden) closeAdd(); });
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if(VIEWS[t] && t !== tab){ tab = t; render(); } });
render();
initCloud();
</script>
